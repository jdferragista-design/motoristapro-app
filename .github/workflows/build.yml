name: Gerar APK do MotoristaPro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Repositorio
      uses: actions/checkout@v4

    - name: Descompactar Projeto
      run: |
        unzip -o motoristapro-app.zip
        ls -la

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Instalar Dependencias e Sincronizar
      run: |
        if [ -d "motoristapro-app" ]; then
          cd motoristapro-app
        fi
        npm install
        npx cap sync android

    - name: Compilar APK Android
      run: |
        if [ -d "motoristapro-app/android" ]; then
          cd motoristapro-app/android
        elif [ -d "android" ]; then
          cd android
        fi
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Disponibilizar APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: MotoristaPro-Instalador-Android
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
