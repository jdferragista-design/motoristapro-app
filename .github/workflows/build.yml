name: Gerar APK do MotoristaPro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 21

    - name: Configurar Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Instalar Dependencias e Sincronizar
      run: |
        npm ci
        npx cap sync android

    - name: Compilar APK Android
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Disponibilizar APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: MotoristaPro-Instalador-Android
        path: android/app/build/outputs/apk/debug/app-debug.apk
